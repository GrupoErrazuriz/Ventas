<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exportación Maderas — Korea</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1117;--surface:#161b27;--surface2:#1e2535;--surface3:#262f42;--border:#2a3348;--border2:#334060;--blue:#4f9eff;--blue-dim:#1a3a6622;--blue-solid:#1a5fc8;--green:#3ecf8e;--green-dim:#0d7a4a22;--amber:#f5a623;--red:#f85149;--muted:#6b7a99;--text:#e2e8f5;--text2:#a0aec0;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;--r:8px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:14px;}
.logo{font-family:var(--mono);font-weight:600;font-size:11px;color:var(--green);letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border:1px solid var(--green);border-radius:var(--r);opacity:.9;}
.h-title{font-size:14px;font-weight:600;color:var(--text);}
.h-sub{font-size:11px;color:var(--muted);margin-top:1px;}
.h-space{flex:1;}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 24px;}
.fl{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;}
select{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--r);padding:5px 8px;font-size:11px;cursor:pointer;outline:none;font-family:var(--sans);}
select:focus{border-color:var(--blue);}
.fsep{width:1px;height:18px;background:var(--border);margin:0 4px;}
.btn-reset{font-family:var(--sans);font-size:10px;font-weight:600;padding:5px 11px;border:1px solid var(--border2);border-radius:var(--r);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;margin-left:auto;}
.btn-reset:hover{color:var(--text);border-color:var(--text2);}
.main{padding:16px 24px;max-width:1600px;margin:0 auto;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:16px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;position:relative;overflow:hidden;}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--blue-solid);}
.kpi.green::before{background:var(--green);}
.kpi.amber::before{background:var(--amber);}
.kpi.red::before{background:var(--red);}
.kpi-label{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.kpi-value{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);line-height:1;}
.kpi-sub{font-size:9px;color:var(--muted);margin-top:4px;}
.sec-title{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--border);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
@media(max-width:900px){.grid2{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.panel-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.panel-title{font-size:12px;font-weight:600;color:var(--text);}
.panel-count{font-family:var(--mono);font-size:10px;color:var(--muted);background:var(--surface2);padding:2px 7px;border-radius:20px;border:1px solid var(--border);}
.panel-vol{font-family:var(--mono);font-size:10px;margin-left:auto;color:var(--text2);}
.req-list{max-height:420px;overflow-y:auto;}
.req-card{border-bottom:1px solid var(--border);padding:12px 16px;cursor:pointer;transition:background .15s;}
.req-card:hover{background:var(--surface2);}
.req-card:last-child{border-bottom:none;}
.req-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.req-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--blue);}
.req-client{font-size:12px;font-weight:600;color:var(--text);}
.req-empresa{font-size:10px;color:var(--muted);background:var(--surface2);padding:1px 6px;border-radius:4px;border:1px solid var(--border);margin-left:auto;}
.req-meta{display:flex;gap:12px;font-size:11px;color:var(--text2);}
.req-lines{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;}
.line-chip{font-family:var(--mono);font-size:9px;background:var(--surface3);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--text2);}
.req-comment{margin-top:6px;font-size:10px;color:var(--amber);font-style:italic;}
.badge-oc{font-family:var(--mono);font-size:9px;padding:2px 6px;border-radius:4px;}
.badge-ok{background:#0d4a2a;color:#3ecf8e;border:1px solid #1a7a44;}
.badge-pend{background:#4a2a0d;color:#f5a623;border:1px solid #7a4a1a;}
.etd-chip{font-family:var(--mono);font-size:10px;color:var(--text2);}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.loading{display:flex;align-items:center;justify-content:center;height:60vh;font-family:var(--mono);color:var(--muted);font-size:13px;}
</style>
</head>
<body>

<div class="header">
  <div class="logo">MADERAS</div>
  <div>
    <div class="h-title">Exportación Maderas — Korea 2026</div>
    <div class="h-sub">Silvertree · DY Global · Órdenes y embarques</div>
  </div>
</div>

<div class="filters">
  <span class="fl">Cliente</span>
  <select id="sel-client" onchange="render()"><option value="">Todos</option></select>
  <div class="fsep"></div>
  <span class="fl">Empresa</span>
  <select id="sel-empresa" onchange="render()"><option value="">Todas</option></select>
  <div class="fsep"></div>
  <span class="fl">Estado</span>
  <select id="sel-estado" onchange="render()">
    <option value="">Todos</option>
    <option value="embarcada">Con OC (embarcadas)</option>
    <option value="pendiente">Sin OC (pendientes)</option>
  </select>
  <div class="fsep"></div>
  <span class="fl">Fuente</span>
  <select id="sel-source" onchange="render()">
    <option value="">Todas</option>
    <option value="Silvertree">Silvertree</option>
    <option value="DY Global">DY Global</option>
  </select>
  <button class="btn-reset" onclick="resetFilters()">✕ Limpiar</button>
</div>

<div class="main" id="main-content">
  <div class="loading" id="loading">Cargando datos...</div>
  <div id="content" style="display:none">
    <div class="kpi-grid" id="kpi-grid"></div>
    <div class="grid2">
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Con OC — Embarcadas</div>
          <span class="panel-count" id="count-emb">0 REQ</span>
          <span class="panel-vol" id="vol-emb">0 m³</span>
        </div>
        <div class="req-list" id="list-emb"></div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">Sin OC — Pendientes</div>
          <span class="panel-count" id="count-pend">0 REQ</span>
          <span class="panel-vol" id="vol-pend">0 m³</span>
        </div>
        <div class="req-list" id="list-pend"></div>
      </div>
    </div>
  </div>
</div>

<script>
let ORDERS = [];

async function loadData() {
  try {
    const res = await fetch('maderas_data.json');
    const d = await res.json();
    ORDERS = d.orders;
    initSelects();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = '';
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML = 'Error cargando maderas_data.json: ' + e.message;
  }
}

function initSelects() {
  const clients  = [...new Set(ORDERS.map(o => o.client))].sort();
  const empresas = [...new Set(ORDERS.map(o => o.empresa))].sort();
  const cs = document.getElementById('sel-client');
  const es = document.getElementById('sel-empresa');
  clients.forEach(c  => cs.appendChild(new Option(c, c)));
  empresas.forEach(e => es.appendChild(new Option(e, e)));
}

function gf() {
  return {
    client:  document.getElementById('sel-client').value,
    empresa: document.getElementById('sel-empresa').value,
    estado:  document.getElementById('sel-estado').value,
    source:  document.getElementById('sel-source').value,
  };
}

function resetFilters() {
  ['sel-client','sel-empresa','sel-estado','sel-source'].forEach(id => document.getElementById(id).value = '');
  render();
}

function filtered() {
  const {client, empresa, estado, source} = gf();
  return ORDERS.filter(o => {
    if (client  && o.client  !== client)  return false;
    if (empresa && o.empresa !== empresa) return false;
    if (source  && o.source  !== source)  return false;
    if (estado === 'embarcada' && o.oc === null) return false;
    if (estado === 'pendiente' && o.oc !== null) return false;
    return true;
  });
}

function fNum(n) { return n.toLocaleString('es-CL'); }

function reqCard(o) {
  const hasOC = o.oc !== null;
  const badge = hasOC
    ? `<span class="badge-oc badge-ok">OC ${o.oc}</span>`
    : `<span class="badge-oc badge-pend">Sin OC</span>`;
  const usd = o.total_usd > 0 ? `$${fNum(o.total_usd)}` : '—';
  const lines = o.lines.map(l =>
    `<span class="line-chip">${l.medida} · ${l.vol}m³ · $${l.precio}</span>`
  ).join('');
  const comment = o.comentario ? `<div class="req-comment">⚠ ${o.comentario}</div>` : '';
  const etd = o.etd ? `<span class="etd-chip">ETD ${o.etd}</span>` : '';
  return `
    <div class="req-card">
      <div class="req-top">
        <span class="req-num">REQ ${o.req}</span>
        ${badge}
        <span class="req-client">${o.client}</span>
        <span class="req-empresa">${o.empresa}</span>
      </div>
      <div class="req-meta">
        <span>${o.total_vol} m³</span>
        <span>${usd} USD</span>
        ${etd}
        <span style="color:var(--muted);font-size:10px">${o.source}</span>
      </div>
      <div class="req-lines">${lines}</div>
      ${comment}
    </div>`;
}

function render() {
  const rows = filtered();
  const emb  = rows.filter(o => o.oc !== null);
  const pend = rows.filter(o => o.oc === null);

  // KPIs
  const totalVol  = rows.reduce((s,o) => s + o.total_vol, 0);
  const embVol    = emb.reduce((s,o)  => s + o.total_vol, 0);
  const pendVol   = pend.reduce((s,o) => s + o.total_vol, 0);
  const totalUSD  = rows.reduce((s,o) => s + o.total_usd, 0);
  const embUSD    = emb.reduce((s,o)  => s + o.total_usd, 0);
  const clients   = new Set(rows.map(o => o.client)).size;

  document.getElementById('kpi-grid').innerHTML = `
    <div class="kpi"><div class="kpi-label">REQs Totales</div><div class="kpi-value">${rows.length}</div><div class="kpi-sub">${clients} clientes</div></div>
    <div class="kpi green"><div class="kpi-label">Vol. Embarcado</div><div class="kpi-value">${fNum(embVol)}</div><div class="kpi-sub">m³ · ${emb.length} REQs con OC</div></div>
    <div class="kpi amber"><div class="kpi-label">Vol. Pendiente</div><div class="kpi-value">${fNum(pendVol)}</div><div class="kpi-sub">m³ · ${pend.length} REQs sin OC</div></div>
    <div class="kpi"><div class="kpi-label">Vol. Total</div><div class="kpi-value">${fNum(totalVol)}</div><div class="kpi-sub">m³</div></div>
    <div class="kpi green"><div class="kpi-label">USD Embarcado</div><div class="kpi-value" style="font-size:15px">$${fNum(embUSD)}</div><div class="kpi-sub">USD</div></div>
    <div class="kpi"><div class="kpi-label">USD Total</div><div class="kpi-value" style="font-size:15px">$${fNum(totalUSD)}</div><div class="kpi-sub">USD</div></div>
  `;

  // Panel counters
  document.getElementById('count-emb').textContent  = emb.length  + ' REQ';
  document.getElementById('vol-emb').textContent    = fNum(embVol) + ' m³';
  document.getElementById('count-pend').textContent = pend.length  + ' REQ';
  document.getElementById('vol-pend').textContent   = fNum(pendVol) + ' m³';

  // Lists
  document.getElementById('list-emb').innerHTML  = emb.length  ? emb.map(reqCard).join('')  : '<div style="padding:20px;color:var(--muted);text-align:center;font-size:12px;">Sin resultados</div>';
  document.getElementById('list-pend').innerHTML = pend.length ? pend.map(reqCard).join('') : '<div style="padding:20px;color:var(--muted);text-align:center;font-size:12px;">Sin resultados</div>';
}

loadData();
</script>
</body>
</html>
